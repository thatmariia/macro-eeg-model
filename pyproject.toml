[project]
name = "macro-eeg-model"
version = "2.0.0"
description = "Modeling EEG with axon propagation delays"
authors = [
    {name = "Mariia Steeghs-Turchina"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sphinx (==8.0.*)",
    "myst-parser (==4.0.*)",
    "sphinx-book-theme (==1.1.*)",
    "sphinx-autoapi (==3.2.*)",
    "sphinx-collapse (==0.1.*)",
    "sphinx-copybutton (==0.5.*)",
    "numpy (==1.26.*)",
    "scipy (==1.13.*)",
    "matplotlib (==3.9.*)",
    "seaborn (==0.13.*)",
    "colorednoise (==2.2.*)",
    "pandas (==2.2.*)",
    "tqdm (==4.66.*)",
    "pyyaml (==6.0.1)",
    "bottleneck (==1.3.6)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "fooof (>=1.1.1,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "macro_eeg_model", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
py_simulate = "simulate:simulate"
py_evaluate = "evaluate:evaluate"
