[project]
name = "macro-eeg-model"
version = "2.0.0"
description = "Modeling EEG with axon propagation delays"
authors = [{ name = "Mariia Steeghs-Turchina" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"

[tool.poetry]
packages = [{ include = "macro_eeg", from = "src" }]

[tool.poetry.group.doc.dependencies]
sphinx = "^8.2.3"
myst-parser = "^4.0.1"
sphinx-book-theme = "^1.1.4"
sphinx-autoapi = "^3.6.1"
sphinx-collapse = "^0.1.3"
sphinx-copybutton = "^0.5.2"



[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"

[tool.poetry.dependencies]
pydantic = "^2.12.4"
numpy = ">=1.26.0,<=2.3.4"
scipy = "^1.16.3"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
colorednoise = "^2.2.0"
pandas = "^2.3.3"
tqdm = "^4.67.1"
pyyaml = "^6.0.3"
bottleneck = "^1.6.0"
scikit-learn = "^1.7.2"
fooof = "^1.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
